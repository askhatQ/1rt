<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Detective</title>
  <style>
    :root {
      --bg: #0F1117;
      --surface: #1C1F2B;
      --border: #2E3347;
      --text: #E8EAF0;
      --accent: #378ADD;
      --ok: #1D9E75;
      --fail: #D85A30;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 480px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
    }

    .cell {
      aspect-ratio: 1;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s, transform 0.1s;
    }

    .cell:hover {
      border-color: var(--accent);
      transform: scale(1.04);
    }

    .cell.highlighted {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 15%, var(--surface));
    }

    .cell.correct {
      border-color: var(--ok);
      background: color-mix(in srgb, var(--ok) 15%, var(--surface));
    }

    .cell.wrong {
      border-color: var(--fail);
      background: color-mix(in srgb, var(--fail) 15%, var(--surface));
    }

    .tray {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 10px;
    }

    .tray-item {
      width: 44px;
      height: 44px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s, transform 0.1s;
    }

    .tray-item:hover {
      border-color: var(--accent);
      transform: scale(1.08);
    }

    .tray-item.selected {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 20%, var(--bg));
    }

    .btn {
      padding: 12px 32px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:hover {
      opacity: 0.88;
      transform: scale(1.03);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .timer-bar {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .timer-bar__fill {
      height: 100%;
      width: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.1s linear, background 0.3s;
    }

    .timer-bar__fill.warning {
      background: var(--fail);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const LEVELS = [
      { items: 4,  time: 8 },
      { items: 6,  time: 6 },
      { items: 8,  time: 5 },
      { items: 10, time: 4 },
      { items: 12, time: 3 },
    ];

    const EMOJIS = [
      '🔑', '🕯️', '🔍', '🗝️', '📜', '🔎', '💼', '🪄',
      '🧩', '🪪', '📷', '🧲', '🔭', '🪬', '💡', '🗂️',
    ];

    const state = {
      phase: 'idle',
      level: 0,
      score: 0,
      solution: [],
      placement: {},
      selected: null,
      timer: 0,
    };

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function renderGrid(showSolution) {
      const app = document.getElementById('app');
      let grid = app.querySelector('.grid');
      if (!grid) {
        grid = document.createElement('div');
        grid.className = 'grid';
        app.appendChild(grid);
      }
      grid.innerHTML = '';

      for (let i = 0; i < 16; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = i;

        if (showSolution) {
          const entry = state.solution.find(s => s.index === i);
          if (entry) {
            cell.textContent = entry.emoji;
            cell.classList.add('highlighted');
          }
        } else {
          const isSolutionSlot = state.solution.some(s => s.index === i);
          const placed = state.placement[i];
          if (placed) {
            cell.textContent = placed;
            cell.classList.add('highlighted');
          } else if (isSolutionSlot) {
            cell.style.borderStyle = 'dashed';
          }
        }

        grid.appendChild(cell);
      }
    }

    let _timerInterval = null;

    function stopTimer() {
      if (_timerInterval !== null) {
        clearInterval(_timerInterval);
        _timerInterval = null;
      }
    }

    function runTimer(seconds, onEnd) {
      stopTimer();

      const fill = document.querySelector('.timer-bar__fill');
      if (!fill) return;

      const start = performance.now();
      const duration = seconds * 1000;

      fill.style.transition = 'none';
      fill.style.width = '100%';
      fill.style.background = 'var(--ok)';

      _timerInterval = setInterval(() => {
        const elapsed = performance.now() - start;
        const ratio = Math.max(0, 1 - elapsed / duration);
        const pct = ratio * 100;

        fill.style.width = pct + '%';

        if (ratio <= 0.2) {
          fill.style.background = 'var(--fail)';
        } else if (ratio <= 0.5) {
          fill.style.background = '#D4852A';
        } else {
          fill.style.background = 'var(--ok)';
        }

        if (ratio <= 0) {
          stopTimer();
          onEnd();
        }
      }, 100);
    }

    function startPlace() {
      state.phase = 'place';
      state.placement = {};
      state.selected = null;

      renderGrid(false);

      const app = document.getElementById('app');

      let tray = app.querySelector('.tray');
      if (tray) tray.remove();
      tray = document.createElement('div');
      tray.className = 'tray';
      app.appendChild(tray);

      const trayEmojis = shuffle(state.solution.map(s => s.emoji));

      function refreshTray() {
        const trayCounts = {};
        trayEmojis.forEach(e => { trayCounts[e] = (trayCounts[e] || 0) + 1; });
        const remaining = { ...trayCounts };
        Object.values(state.placement).forEach(e => { if (remaining[e]) remaining[e]--; });
        document.querySelectorAll('.tray-item').forEach(item => {
          item.classList.remove('selected');
          const avail = (remaining[item.dataset.emoji] || 0) > 0;
          item.style.opacity = avail ? '' : '0.3';
          item.style.pointerEvents = avail ? '' : 'none';
          if (item.dataset.emoji === state.selected) item.classList.add('selected');
        });
      }

      trayEmojis.forEach(emoji => {
        const item = document.createElement('div');
        item.className = 'tray-item';
        item.textContent = emoji;
        item.dataset.emoji = emoji;
        item.addEventListener('click', () => {
          state.selected = state.selected === emoji ? null : emoji;
          refreshTray();
        });
        tray.appendChild(item);
      });

      const grid = app.querySelector('.grid');
      grid.addEventListener('click', e => {
        const cell = e.target.closest('.cell');
        if (!cell) return;
        const idx = parseInt(cell.dataset.index);
        const isSolutionSlot = state.solution.some(s => s.index === idx);
        if (!isSolutionSlot || !state.selected) return;

        const prevIdx = Object.keys(state.placement).find(k => state.placement[k] === state.selected);
        if (prevIdx !== undefined) delete state.placement[prevIdx];

        state.placement[idx] = state.selected;
        state.selected = null;

        renderGrid(false);
        refreshTray();
      });

      let btn = app.querySelector('.btn');
      if (btn) btn.remove();
      btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = 'Проверить';
      btn.addEventListener('click', () => {
        stopTimer();
        checkResult();
      });
      app.appendChild(btn);

      runTimer(35, checkResult);
    }

    function checkResult() {
      stopTimer();
      state.phase = 'result';

      const total = state.solution.length;
      let correct = 0;
      state.solution.forEach(({ index, emoji }) => {
        if (state.placement[index] === emoji) correct++;
      });

      const ratio = total > 0 ? correct / total : 0;
      const earned = Math.round(ratio * (state.level + 1) * 10);
      state.score += earned;

      const grid = document.querySelector('.grid');
      if (grid) {
        grid.querySelectorAll('.cell').forEach(cell => {
          const idx = parseInt(cell.dataset.index);
          const solEntry = state.solution.find(s => s.index === idx);
          if (!solEntry) return;
          cell.textContent = solEntry.emoji;
          if (state.placement[idx] === solEntry.emoji) {
            cell.classList.add('correct');
          } else {
            cell.classList.add('wrong');
            if (state.placement[idx]) {
              cell.textContent = state.placement[idx] + ' → ' + solEntry.emoji;
              cell.style.fontSize = '13px';
            }
          }
        });
      }

      const app = document.getElementById('app');
      app.querySelector('.tray')?.remove();
      app.querySelector('.btn')?.remove();

      const stars = ratio === 1 ? '★★★' : ratio >= 0.5 ? '★★☆' : '★☆☆';

      const panel = document.createElement('div');
      panel.style.cssText = `
        display:flex; flex-direction:column; align-items:center; gap:12px;
        background:var(--surface); border:2px solid var(--border);
        border-radius:14px; padding:20px 24px; width:100%; text-align:center;
      `;
      panel.innerHTML = `
        <div style="font-size:32px; letter-spacing:4px; color:var(--accent)">${stars}</div>
        <div style="font-size:18px; font-weight:700">
          ${correct} / ${total} правильно
        </div>
        <div style="font-size:14px; color:var(--accent)">+${earned} очков · Всего: ${state.score}</div>
      `;

      const btnRow = document.createElement('div');
      btnRow.style.cssText = 'display:flex; gap:12px; margin-top:4px;';

      const btnRepeat = document.createElement('button');
      btnRepeat.className = 'btn';
      btnRepeat.style.background = 'var(--border)';
      btnRepeat.textContent = 'Повторить';
      btnRepeat.addEventListener('click', restartLevel);

      const btnNext = document.createElement('button');
      btnNext.className = 'btn';
      btnNext.textContent = 'Дальше →';
      btnNext.addEventListener('click', nextLevel);

      btnRow.appendChild(btnRepeat);
      btnRow.appendChild(btnNext);
      panel.appendChild(btnRow);
      app.appendChild(panel);
    }
  </script>
</body>
</html>
