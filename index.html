<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Detective</title>
  <style>
    :root {
      --bg:      #0a0f2e;
      --surface: #1a2040;
      --surface2:#1e2650;
      --border:  #1e3060;
      --text:    #e8eaf0;
      --accent:  #00d4ff;
      --ok:      #00e676;
      --fail:    #ff4466;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle, rgba(0,212,255,0.10) 1px, transparent 1px),
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px, 40px 40px, 40px 40px;
      background-position: 20px 20px, 0 0, 0 0;
      color: var(--text);
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 480px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
    }

    .cell {
      aspect-ratio: 1;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      cursor: pointer;
      user-select: none;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
    }

    .cell::before {
      content: '🛡️';
      position: absolute;
      font-size: 36px;
      opacity: 0.08;
      pointer-events: none;
      user-select: none;
    }

    .cell:hover {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(0,212,255,0.35);
      transform: scale(1.04);
    }

    /* empty solution slot — replaces dashed border */
    .cell.slot {
      border-color: var(--accent);
      box-shadow: 0 0 14px rgba(0,212,255,0.45), inset 0 0 10px rgba(0,212,255,0.07);
      animation: slot-pulse 2s ease-in-out infinite;
    }

    @keyframes slot-pulse {
      0%, 100% { box-shadow: 0 0 10px rgba(0,212,255,0.3),  inset 0 0 8px  rgba(0,212,255,0.05); }
      50%       { box-shadow: 0 0 22px rgba(0,212,255,0.65), inset 0 0 14px rgba(0,212,255,0.12); }
    }

    .cell.highlighted {
      border-color: var(--accent);
      background: rgba(0,212,255,0.10);
      box-shadow: 0 0 14px rgba(0,212,255,0.55);
    }

    @keyframes flash-correct {
      0%, 100% { background: rgba(0,230,118,0.12); }
      50%       { background: rgba(0,230,118,0.45); }
    }
    @keyframes flash-wrong {
      0%, 100% { background: rgba(255,68,102,0.12); }
      50%       { background: rgba(255,68,102,0.45); }
    }

    .cell.correct {
      border-color: var(--ok);
      background: rgba(0,230,118,0.12);
      box-shadow: 0 0 14px rgba(0,230,118,0.5);
      animation: flash-correct 300ms ease 2;
    }

    .cell.wrong {
      border-color: var(--fail);
      background: rgba(255,68,102,0.12);
      box-shadow: 0 0 14px rgba(255,68,102,0.5);
      animation: flash-wrong 300ms ease 2;
    }

    /* ── Tray ── */
    .tray {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px;
    }

    .tray-item {
      width: 48px;
      height: 48px;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
    }

    .tray-item:hover {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(0,212,255,0.5);
      transform: scale(1.08);
    }

    .tray-item.selected {
      border-color: var(--accent);
      background: rgba(0,212,255,0.12);
      box-shadow: 0 0 16px rgba(0,212,255,0.7);
    }

    /* ── Button ── */
    .btn {
      padding: 14px 40px;
      background: linear-gradient(135deg, #0055ff, #00d4ff);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0,212,255,0.45), 0 0 40px rgba(0,212,255,0.15);
      transition: box-shadow 0.2s, transform 0.1s, opacity 0.15s;
    }

    .btn:hover {
      box-shadow: 0 0 30px rgba(0,212,255,0.7), 0 0 60px rgba(0,212,255,0.25);
      transform: scale(1.04);
    }

    .btn:active  { transform: scale(0.97); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    /* ── Timer bar ── */
    .timer-bar {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.07);
      border-radius: 4px;
    }

    .timer-bar__fill {
      height: 100%;
      width: 100%;
      background: var(--ok);
      border-radius: 4px;
      transition: width 0.1s linear;
    }

    /* ── Misc ── */
    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 28px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,0,0,0.4);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const LEVELS = [
      { items: 4,  time: 8 },
      { items: 6,  time: 6 },
      { items: 8,  time: 5 },
      { items: 10, time: 4 },
      { items: 12, time: 3 },
    ];

    const EMOJIS = [
      '🔍', '🗝️', '🕯️', '📷', '🎩', '🧲', '📜', '🔭',
      '⚗️', '💎', '🦉', '🎭', '🪬', '🧪', '🔐', '📡',
    ];

    const state = {
      phase: 'idle',
      level: 0,
      score: 0,
      solution: [],
      placement: {},
      selected: null,
    };

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function renderGrid(showSolution) {
      const app = document.getElementById('app');
      let grid = app.querySelector('.grid');
      if (!grid) {
        grid = document.createElement('div');
        grid.className = 'grid';
        app.appendChild(grid);
      }
      grid.innerHTML = '';

      for (let i = 0; i < 16; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = i;

        if (showSolution) {
          const entry = state.solution.find(s => s.index === i);
          if (entry) {
            cell.textContent = entry.emoji;
            cell.classList.add('highlighted');
          }
        } else {
          const isSolutionSlot = state.solution.some(s => s.index === i);
          const placed = state.placement[i];
          if (placed) {
            cell.textContent = placed;
            cell.classList.add('highlighted');
          } else if (isSolutionSlot) {
            cell.classList.add('slot');
            cell.addEventListener('dragover', e => {
              e.preventDefault();
              cell.style.borderColor = '#fff';
            });
            cell.addEventListener('dragleave', () => {
              cell.style.borderColor = '';
            });
            cell.addEventListener('drop', e => {
              e.preventDefault();
              cell.style.borderColor = '';
              const emoji = e.dataTransfer.getData('text/plain');
              if (_onDrop) _onDrop(i, emoji);
            });
          }
        }

        grid.appendChild(cell);
      }
    }

    let _timerInterval = null;
    let _onDrop = null;

    function stopTimer() {
      if (_timerInterval !== null) {
        clearInterval(_timerInterval);
        _timerInterval = null;
      }
    }

    function runTimer(seconds, onEnd, onTick) {
      stopTimer();

      const fill = document.querySelector('.timer-bar__fill');
      if (!fill) return;

      const start = performance.now();
      const duration = seconds * 1000;

      fill.style.width = '100%';
      fill.style.background = 'var(--ok)';
      fill.style.boxShadow = '0 0 10px var(--ok)';

      _timerInterval = setInterval(() => {
        const elapsed = performance.now() - start;
        const ratio = Math.max(0, 1 - elapsed / duration);

        fill.style.width = (ratio * 100) + '%';

        if (ratio <= 0.2) {
          fill.style.background = 'var(--fail)';
          fill.style.boxShadow = '0 0 10px var(--fail)';
        } else if (ratio <= 0.5) {
          fill.style.background = '#D4852A';
          fill.style.boxShadow = '0 0 10px #D4852A';
        } else {
          fill.style.background = 'var(--ok)';
          fill.style.boxShadow = '0 0 10px var(--ok)';
        }

        if (onTick) onTick(Math.ceil(ratio * seconds));

        if (ratio <= 0) {
          stopTimer();
          onEnd();
        }
      }, 100);
    }

    function startLevel() {
      const app = document.getElementById('app');
      app.innerHTML = '';
      state.phase = 'memorize';
      state.placement = {};
      state.selected = null;

      const lv = LEVELS[state.level];
      const indices = shuffle([...Array(16).keys()]).slice(0, lv.items);
      const emojis = shuffle(EMOJIS).slice(0, lv.items);
      state.solution = indices.map((index, i) => ({ index, emoji: emojis[i] }));

      const header = document.createElement('div');
      header.className = 'header-row';
      header.innerHTML = `<span>Уровень ${state.level + 1} / ${LEVELS.length}</span><span>Счёт: ${state.score}</span>`;
      app.appendChild(header);

      const timerBar = document.createElement('div');
      timerBar.className = 'timer-bar';
      timerBar.innerHTML = '<div class="timer-bar__fill"></div>';
      app.appendChild(timerBar);

      const countdownWrap = document.createElement('div');
      countdownWrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:2px;width:100%';

      const label = document.createElement('div');
      label.style.cssText = 'font-size:11px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.4)';
      label.textContent = 'Запомни!';

      const countdown = document.createElement('div');
      countdown.style.cssText = `
        font-size:72px;font-weight:900;line-height:1;
        color:var(--accent);text-shadow:0 0 24px var(--accent),0 0 48px rgba(0,212,255,0.4);
      `;
      countdown.textContent = lv.time;

      countdownWrap.appendChild(label);
      countdownWrap.appendChild(countdown);
      app.appendChild(countdownWrap);

      renderGrid(true);
      runTimer(lv.time, readyPause, secs => {
        if (countdown.isConnected) countdown.textContent = secs;
      });
    }

    function readyPause() {
      stopTimer();
      const app = document.getElementById('app');
      app.innerHTML = '';

      const screen = document.createElement('div');
      screen.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:16px;padding:48px 28px;width:100%;text-align:center';
      screen.innerHTML = `
        <div style="font-size:64px;text-shadow:0 0 24px var(--accent)">🕵️</div>
        <div style="font-size:32px;font-weight:900;letter-spacing:3px;text-transform:uppercase;
                    color:var(--accent);text-shadow:0 0 20px var(--accent)">Расставляй!</div>
      `;
      app.appendChild(screen);
      setTimeout(startPlace, 1000);
    }

    function startPlace() {
      const app = document.getElementById('app');
      app.innerHTML = '';
      state.phase = 'place';
      state.placement = {};
      state.selected = null;

      const header = document.createElement('div');
      header.className = 'header-row';
      header.innerHTML = `<span>Уровень ${state.level + 1} / ${LEVELS.length}</span><span>Счёт: ${state.score}</span>`;
      app.appendChild(header);

      const timerRow = document.createElement('div');
      timerRow.style.cssText = 'display:flex;align-items:center;gap:10px;width:100%';
      const timerBar = document.createElement('div');
      timerBar.className = 'timer-bar';
      timerBar.style.flex = '1';
      timerBar.innerHTML = '<div class="timer-bar__fill"></div>';
      const secDisplay = document.createElement('span');
      secDisplay.style.cssText = 'font-size:13px;font-weight:700;color:var(--accent);min-width:32px;text-align:right';
      secDisplay.textContent = '35с';
      timerRow.appendChild(timerBar);
      timerRow.appendChild(secDisplay);
      app.appendChild(timerRow);

      const label = document.createElement('div');
      label.style.cssText = 'font-size:11px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.4);width:100%';
      label.textContent = 'Расставь улики по местам';
      app.appendChild(label);

      renderGrid(false);

      const tray = document.createElement('div');
      tray.className = 'tray';
      app.appendChild(tray);

      const trayEmojis = shuffle(state.solution.map(s => s.emoji));
      const trayItems = [];

      function refreshTray() {
        const remaining = {};
        trayEmojis.forEach(e => { remaining[e] = (remaining[e] || 0) + 1; });
        Object.values(state.placement).forEach(e => { if (remaining[e]) remaining[e]--; });
        trayItems.forEach(({ item, emoji }) => {
          item.classList.toggle('selected', emoji === state.selected);
          const avail = (remaining[emoji] || 0) > 0;
          item.style.opacity = avail ? '' : '0.25';
          item.style.pointerEvents = avail ? '' : 'none';
        });
      }

      function selectItem(emoji) {
        state.selected = state.selected === emoji ? null : emoji;
        refreshTray();
      }

      function placeItem(idx) {
        if (state.phase !== 'place') return;
        if (!state.solution.some(s => s.index === idx)) return;

        if (state.placement[idx] && !state.selected) {
          delete state.placement[idx];
          renderGrid(false);
          refreshTray();
          return;
        }

        if (!state.selected) return;

        const prevIdx = Object.keys(state.placement).find(k => state.placement[k] === state.selected);
        if (prevIdx !== undefined) delete state.placement[prevIdx];

        state.placement[idx] = state.selected;
        state.selected = null;

        renderGrid(false);
        refreshTray();

        if (Object.keys(state.placement).length === state.solution.length) {
          setTimeout(checkResult, 400);
        }
      }

      trayEmojis.forEach(emoji => {
        const item = document.createElement('div');
        item.className = 'tray-item';
        item.textContent = emoji;
        item.draggable = true;
        item.addEventListener('click', () => selectItem(emoji));
        item.addEventListener('dragstart', e => {
          e.dataTransfer.setData('text/plain', emoji);
          e.dataTransfer.effectAllowed = 'move';
          item.style.opacity = '0.4';
        });
        item.addEventListener('dragend', () => { item.style.opacity = ''; });
        tray.appendChild(item);
        trayItems.push({ item, emoji });
      });

      _onDrop = (idx, emoji) => {
        state.selected = emoji;
        placeItem(idx);
      };

      const grid = app.querySelector('.grid');
      grid.addEventListener('click', e => {
        const cell = e.target.closest('.cell');
        if (!cell) return;
        placeItem(parseInt(cell.dataset.index));
      });

      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = 'Проверить';
      btn.addEventListener('click', () => { stopTimer(); checkResult(); });
      app.appendChild(btn);

      runTimer(35, checkResult, secs => {
        if (secDisplay.isConnected) secDisplay.textContent = secs + 'с';
      });
    }

    function checkResult() {
      if (state.phase === 'result') return;
      stopTimer();
      state.phase = 'result';

      const total = state.solution.length;
      let correct = 0;
      state.solution.forEach(({ index, emoji }) => {
        if (state.placement[index] === emoji) correct++;
      });

      const ratio = total > 0 ? correct / total : 0;
      const earned = Math.round(ratio * (state.level + 1) * 10);
      state.score += earned;

      const grid = document.querySelector('.grid');
      if (grid) {
        grid.querySelectorAll('.cell').forEach(cell => {
          const idx = parseInt(cell.dataset.index);
          const solEntry = state.solution.find(s => s.index === idx);
          if (!solEntry) return;
          cell.textContent = solEntry.emoji;
          cell.style.fontSize = '';
          if (state.placement[idx] === solEntry.emoji) {
            cell.classList.add('correct');
          } else {
            cell.classList.add('wrong');
            if (state.placement[idx]) {
              cell.textContent = state.placement[idx] + '→' + solEntry.emoji;
              cell.style.fontSize = '11px';
            }
          }
        });
      }

      const app = document.getElementById('app');
      app.querySelector('.tray')?.remove();
      app.querySelector('.btn')?.remove();

      const stars = ratio === 1 ? '★★★' : ratio >= 0.5 ? '★★☆' : '★☆☆';
      const isLastLevel = state.level === LEVELS.length - 1;

      const panel = document.createElement('div');
      panel.className = 'panel';
      panel.innerHTML = `
        <div style="font-size:30px;letter-spacing:6px;color:var(--accent);
                    text-shadow:0 0 12px var(--accent)">${stars}</div>
        <div style="font-size:20px;font-weight:800">${correct} / ${total} правильно</div>
        <div style="font-size:13px;color:var(--accent);letter-spacing:1px">
          +${earned} ОЧКОВ &nbsp;·&nbsp; ВСЕГО: ${state.score}
        </div>
      `;

      const btnRow = document.createElement('div');
      btnRow.style.cssText = 'display:flex;gap:10px;margin-top:6px;';

      const btnRepeat = document.createElement('button');
      btnRepeat.className = 'btn';
      btnRepeat.style.cssText = 'background:var(--surface2);box-shadow:none;border:1px solid var(--border)';
      btnRepeat.textContent = 'Повторить';
      btnRepeat.addEventListener('click', restartLevel);
      btnRow.appendChild(btnRepeat);

      panel.appendChild(btnRow);
      app.appendChild(panel);

      setTimeout(() => {
        const btnNext = document.createElement('button');
        btnNext.className = 'btn';
        btnNext.textContent = isLastLevel ? 'В начало' : 'Дальше →';
        btnNext.addEventListener('click', isLastLevel ? restartAll : nextLevel);
        btnRow.appendChild(btnNext);
      }, 650);
    }

    function nextLevel() {
      state.level = Math.min(state.level + 1, LEVELS.length - 1);
      startLevel();
    }

    function restartLevel() {
      startLevel();
    }

    function restartAll() {
      const hs = parseInt(localStorage.getItem('md_highscore') || '0');
      if (state.score > hs) localStorage.setItem('md_highscore', state.score);
      state.score = 0;
      state.level = 0;
      showStart();
    }

    function showStart() {
      const hs = parseInt(localStorage.getItem('md_highscore') || '0');
      const app = document.getElementById('app');
      app.innerHTML = '';

      const screen = document.createElement('div');
      screen.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:28px;padding:32px 20px;width:100%;text-align:center';

      screen.innerHTML = `
        <div style="font-size:80px;line-height:1;
                    text-shadow:0 0 20px #00d4ff,0 0 40px #00d4ff,0 0 80px #0055ff">🔍</div>
        <div>
          <div style="font-size:48px;font-weight:900;letter-spacing:4px;color:#fff;line-height:1.1;
                      text-shadow:0 0 24px rgba(0,212,255,0.5)">MEMORY</div>
          <div style="font-size:48px;font-weight:900;letter-spacing:4px;color:#fff;line-height:1.1;
                      text-shadow:0 0 24px rgba(0,212,255,0.5)">DETECTIVE</div>
        </div>
        <div style="font-size:14px;font-style:italic;color:#4a6080;max-width:260px;line-height:1.6">
          Запомни, где лежат улики, и расставь их по местам
        </div>
        ${hs > 0 ? `<div style="font-size:12px;letter-spacing:2px;color:var(--accent)">РЕКОРД: ${hs} ОЧКОВ</div>` : ''}
      `;

      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = 'Начать';
      btn.addEventListener('click', () => {
        state.score = 0;
        state.level = 0;
        startLevel();
      });
      screen.appendChild(btn);
      app.appendChild(screen);
    }

    showStart();
  </script>
</body>
</html>
