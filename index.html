<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Detective</title>
  <style>
    :root {
      --bg: #0F1117;
      --surface: #1C1F2B;
      --border: #2E3347;
      --text: #E8EAF0;
      --accent: #378ADD;
      --ok: #1D9E75;
      --fail: #D85A30;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 480px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
    }

    .cell {
      aspect-ratio: 1;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s, transform 0.1s;
    }

    .cell:hover {
      border-color: var(--accent);
      transform: scale(1.04);
    }

    .cell.highlighted {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 15%, var(--surface));
    }

    .cell.correct {
      border-color: var(--ok);
      background: color-mix(in srgb, var(--ok) 15%, var(--surface));
    }

    .cell.wrong {
      border-color: var(--fail);
      background: color-mix(in srgb, var(--fail) 15%, var(--surface));
    }

    .tray {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 10px;
    }

    .tray-item {
      width: 44px;
      height: 44px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s, transform 0.1s;
    }

    .tray-item:hover {
      border-color: var(--accent);
      transform: scale(1.08);
    }

    .tray-item.selected {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 20%, var(--bg));
    }

    .btn {
      padding: 12px 32px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:hover {
      opacity: 0.88;
      transform: scale(1.03);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .timer-bar {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .timer-bar__fill {
      height: 100%;
      width: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.1s linear, background 0.3s;
    }

    .timer-bar__fill.warning {
      background: var(--fail);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const LEVELS = [
      { items: 4,  time: 8 },
      { items: 6,  time: 6 },
      { items: 8,  time: 5 },
      { items: 10, time: 4 },
      { items: 12, time: 3 },
    ];

    const EMOJIS = [
      '🔑', '🕯️', '🔍', '🗝️', '📜', '🔎', '💼', '🪄',
      '🧩', '🪪', '📷', '🧲', '🔭', '🪬', '💡', '🗂️',
    ];

    const state = {
      phase: 'idle',
      level: 0,
      score: 0,
      solution: [],
      placement: {},
      selected: null,
      timer: 0,
    };

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function renderGrid(showSolution) {
      const app = document.getElementById('app');
      let grid = app.querySelector('.grid');
      if (!grid) {
        grid = document.createElement('div');
        grid.className = 'grid';
        app.appendChild(grid);
      }
      grid.innerHTML = '';

      for (let i = 0; i < 16; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = i;

        if (showSolution) {
          const entry = state.solution.find(s => s.index === i);
          if (entry) {
            cell.textContent = entry.emoji;
            cell.classList.add('highlighted');
          }
        } else {
          const isSolutionSlot = state.solution.some(s => s.index === i);
          const placed = state.placement[i];
          if (placed) {
            cell.textContent = placed;
            cell.classList.add('highlighted');
          } else if (isSolutionSlot) {
            cell.style.borderStyle = 'dashed';
          }
        }

        grid.appendChild(cell);
      }
    }
  </script>
</body>
</html>
